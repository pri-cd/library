<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="./assets/scripts.js" defer></script>
</head>

<body>
    <header class="title">Library Dashboard</header>

    <main class="main" id="main">
        <div class="book-grid" id="book-grid">
        </div>

        <dialog class="dialog-box" id="dialog-box">
            <header class="dialog-header"><img src="./assets/icons/book.png" alt="">Book Information</header>

            <form class="dialog-form" id="dialog-form">
                <div class="dialog-form-group">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title" placeholder="Title of the book">

                    <label for="author">Author</label>
                    <input type="text" name="author" id="author" placeholder="Author of the book">
                    <label for="pages">Pages</label>
                    <input type="number" name="pages" id="pages" placeholder="Number of pages">
                </div>

                <div class="dialog-btn-container">
                    <button type="submit" id="submit">Submit</button>
                    <button type="button" class="close-dialogue" id="close-dialogue">Close</button>
                </div>
            </form>
        </dialog>

        <button class="add-book-btn" id="add-book-btn">Add a Book</button>
    </main>

    <footer class="footer">This is storing data on local storage, cloud not yet implemented.</footer>
</body>

</html>
